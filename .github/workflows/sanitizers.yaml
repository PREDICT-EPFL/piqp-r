# On-demand sanitizer check, mirroring CRAN's gcc-UBSAN and clang-UBSAN
# additional checks via the r-hub containers.
#
#   gcc16-ubsan  r-hub gcc16 image (Fedora 44, GCC 16, same as CRAN's
#                gcc-UBSAN machine); piqp built with UBSan.
#   gcc-asan     r-hub gcc-asan image (GCC 15); R and piqp with ASan+UBSan.
#   clang-ubsan  r-hub clang-ubsan image; R and piqp with clang UBSan.
#
# Trigger from the Actions tab or with
#   gh workflow run sanitizers.yaml
#   gh workflow run sanitizers.yaml -f image=all -f ref=<commit>
#
# R CMD check itself reports OK even when a sanitizer fires (the diagnostics
# only appear in the install, test, and vignette logs), so the final step
# greps every log under piqp.Rcheck and fails the job on any hit.

name: sanitizers

run-name: >-
  sanitizers (${{ inputs.image }}) on ${{ inputs.ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Sanitizer image'
        type: choice
        default: gcc16-ubsan
        options:
          - gcc16-ubsan
          - gcc-asan
          - clang-ubsan
          - all
      ref:
        description: 'Git ref (branch, tag, or commit) of piqp-r to check. Empty = this branch.'
        type: string
        default: ''

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.image == 'all' && '["gcc16-ubsan", "gcc-asan", "clang-ubsan"]' || format('["{0}"]', inputs.image)) }}

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.image == 'gcc16-ubsan' && 'gcc16' || matrix.image }}:latest

    env:
      # Same options CRAN uses: R itself leaks by design; print UBSan stacks.
      ASAN_OPTIONS: detect_leaks=0:alloc_dealloc_mismatch=0
      UBSAN_OPTIONS: print_stacktrace=1
      _R_CHECK_FORCE_SUGGESTS_: 'false'
      # Keep the vignette rebuild output even when it succeeds, as CRAN does.
      # CRAN's report of the LLT bug came from this log.
      _R_CHECK_ALWAYS_LOG_VIGNETTE_OUTPUT_: 'true'
      OMP_THREAD_LIMIT: '2'

    steps:
      - name: Install system tools (git, patch, pandoc)
        shell: bash
        run: |
          if command -v dnf > /dev/null; then
            dnf -y install git patch pandoc libubsan
          else
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git patch pandoc
          fi

      # Check out this branch with full history, then switch to the requested
      # ref if one was given. Done in two steps so that abbreviated commit
      # SHAs work (actions/checkout only accepts full SHAs in 'ref').
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          path: pkg

      # Taken from this branch before switching refs, so it also applies when
      # checking an older commit that predates the files. Starts from any
      # Makevars the image already points R_MAKEVARS_USER at (the gcc16 image
      # does), so its CRAN-like flags are kept rather than silently replaced.
      - name: Install user Makevars
        shell: bash
        run: |
          mkdir -p "$HOME/.R"
          mv_user="$HOME/.R/Makevars.sanitizers"
          : > "$mv_user"
          if [ -n "${R_MAKEVARS_USER:-}" ] && [ -f "$R_MAKEVARS_USER" ]; then
            cat "$R_MAKEVARS_USER" >> "$mv_user"
          fi
          cat pkg/.github/Makevars.sanitizers >> "$mv_user"
          if [ "${{ matrix.image }}" = "gcc16-ubsan" ]; then
            cat pkg/.github/Makevars.ubsan >> "$mv_user"
          fi
          echo "R_MAKEVARS_USER=$mv_user" >> "$GITHUB_ENV"
          cat "$mv_user"

      - name: Switch to requested ref
        if: inputs.ref != ''
        shell: bash
        working-directory: pkg
        run: |
          git config --global --add safe.directory "$PWD"
          git checkout --detach "${{ inputs.ref }}"
          git submodule update --init --recursive
          git log --oneline -1

      - name: Session info
        shell: bash
        run: |
          R --version | head -n 1
          R -q -e 'cat(R.version$platform, "\n"); print(Sys.getenv(c("CC", "CXX")))'
          R CMD config CXX17
          R CMD config CXX17FLAGS

      - name: Install dependencies
        shell: bash
        working-directory: pkg
        run: |
          R -q -e 'pak::local_install_deps(dependencies = TRUE)'

      - name: Build
        shell: bash
        run: |
          R CMD build --no-manual pkg
          ls -l piqp_*.tar.gz

      - name: Check
        shell: bash
        run: |
          R CMD check --as-cran --no-manual piqp_*.tar.gz

      - name: Fail on sanitizer diagnostics
        if: always()
        shell: bash
        run: |
          if [ ! -d piqp.Rcheck ]; then
            echo "::error::piqp.Rcheck not found; build or check did not run"
            exit 1
          fi
          # UBSan: "runtime error:"; ASan/LSan/MSan: "ERROR: <X>Sanitizer".
          pattern='runtime error:|ERROR: [A-Za-z]*Sanitizer|SUMMARY: [A-Za-z]*Sanitizer'
          if grep -rIEn "$pattern" piqp.Rcheck > sanitizer-hits.txt; then
            echo "::error::Sanitizer diagnostics found in piqp.Rcheck logs"
            cat sanitizer-hits.txt
            echo "----- context -----"
            grep -rIEn -A 12 "$pattern" piqp.Rcheck | head -n 200
            exit 1
          fi
          echo "No sanitizer diagnostics found."

      - name: Upload check directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piqp.Rcheck-${{ matrix.image }}
          path: |
            piqp.Rcheck
            sanitizer-hits.txt
          if-no-files-found: ignore
